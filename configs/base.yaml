seed: 0
out_dir: runs/tmp

data:
  root: data/dcase2026_dev        # <root>/<machine>/{train,test}/*.wav
  machine: fan
  fraction: 0.1                   # fraction of normal training clips used (0.05 / 0.1 / 0.25 / 1.0)
  holdout_frac: 0.1               # fixed held-out normal clips (for SVD gap); never used for training
  min_per_group: 2                # min clips kept per (section, domain) group when subsampling
  label_mode: attr                # proxy task labels: attr | section | section_domain
  test_labels_csv: null           # optional csv (filename,label) if test names carry no normal/anomaly

audio:
  sample_rate: 16000
  duration: 10.0
  n_fft: 1024
  hop_length: 512
  n_mels: 128
  f_min: 20
  f_max: 8000
  channel_mode: mean              # ch1 | mean | stack (stack = near+far as 2 input channels)

model:
  backbone: resnet_lite           # eat / beats = not implemented yet (see src/models.py)
  embed_dim: 128
  widths: [16, 32, 64, 128]

train:
  epochs: 60
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-2            # AdamW decoupled weight decay (tune this for the baseline!)
  min_steps_per_epoch: 30         # repeat small datasets so every fraction gets a similar step budget
  num_workers: 4
  label_smoothing: 0.0
  mixup_alpha: 0.0
  specaugment: false
  freq_mask: 16
  time_mask: 32
  n_masks: 2

reg:                              # all off by default
  nuclear_emb: 0.0                # lambda for nuclear norm of batch embeddings
  nuclear_weights: 0.0            # lambda for nuclear norm of weights
  spectral_penalty: 0.0           # lambda for spectral-norm penalty
  spectral_norm: false            # hard spectral normalisation of layers
  scope: linear                   # linear | all  (see BatchNorm caveat in src/regularizers.py)

svd:
  every: 5
  max_samples: 512

eval:
  primary: knn                    # knn | maha
  knn_k: 1
  metric: cosine
