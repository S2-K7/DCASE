_base_: nuclear_emb.yaml          # tiny settings for the synthetic-data smoke test
data:
  root: data/synthetic
  machine: synthmachine
  holdout_frac: 0.2
audio:
  duration: 2.0
  n_mels: 32
  n_fft: 512
  hop_length: 256
  f_max: 8000
model:
  embed_dim: 32
  widths: [8, 16, 16, 32]
train:
  epochs: 3
  batch_size: 8
  min_steps_per_epoch: 5
  num_workers: 0
svd:
  every: 1
  max_samples: 64
